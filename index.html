<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3fd6">
<title>Download Computer For Android Phone</title>
<link rel="icon" href="./icon.jpg">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:#0a3fd6 url(./bg.jpg) center/cover no-repeat fixed;color:#fff;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;background:linear-gradient(160deg,rgba(6,20,70,.35),rgba(6,20,70,.65));z-index:0}
  .card{position:relative;z-index:1;width:100%;max-width:400px;padding:34px 26px 28px;text-align:center;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:32px;
    backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow:0 30px 80px rgba(0,10,60,.55),inset 0 1px 0 rgba(255,255,255,.35);animation:up .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
  .icon{width:116px;height:116px;margin:0 auto 22px;border-radius:28px;overflow:hidden;
    box-shadow:0 14px 34px rgba(0,20,90,.55),0 0 0 3px rgba(255,255,255,.35);animation:float 4s ease-in-out infinite}
  .icon img{width:100%;height:100%;display:block;object-fit:cover}
  @keyframes float{50%{transform:translateY(-8px)}}
  h1{margin:0;font-size:27px;line-height:1.2;font-weight:800;letter-spacing:-.4px;text-shadow:0 2px 14px rgba(0,20,90,.5)}
  h1 span{display:block;font-size:15px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;opacity:.85;margin-bottom:6px}
  .meta{margin:14px 0 26px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .meta b{font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25)}
  .btn{position:relative;width:100%;height:60px;border:0;border-radius:18px;cursor:pointer;overflow:hidden;
    font:700 18px/1 inherit;font-family:inherit;color:#06214f;background:linear-gradient(180deg,#fff,#dbe9ff);
    box-shadow:0 12px 30px rgba(0,20,90,.5),inset 0 -3px 0 rgba(0,60,200,.18);transition:transform .15s,box-shadow .15s}
  .btn:active{transform:scale(.97)}
  .btn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .2s}
  .btn .lbl{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn.busy{color:#fff;cursor:progress}
  .btn.done{background:linear-gradient(180deg,#34d399,#10b981);color:#032b1d}
  .btn svg{width:22px;height:22px;flex:none}
  .msg{min-height:18px;margin-top:14px;font-size:13px;opacity:.9}
  .msg.err{color:#ffd0d0;opacity:1}
  .foot{margin-top:6px;font-size:11.5px;opacity:.65}
  .cp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:5;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    font-size:20px;text-decoration:none;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 22px rgba(0,10,60,.4);transition:transform .15s}
  .cp{padding:0;cursor:pointer;font-family:inherit}
  .cp:active{transform:scale(.9)}

  .hide{display:none!important}
  .agree{margin-top:16px;font-size:12px;line-height:1.5;opacity:.85}
  .agree a,.legal a{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:2px}
  .legal{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2);font-size:12px;display:flex;justify-content:center;gap:10px;opacity:.9}
  .legal i{opacity:.5;font-style:normal}
</style>
</head>
<body>
<button class="cp" id="cp" type="button" aria-label="·">🔵</button>
<main class="card">
  <div class="icon"><img alt="Computer" src="./icon.jpg"></div>
  <h1><span>Download</span>Computer For Android Phone</h1>
  <div class="meta"><b>Android</b><b>APK</b><b id="size">Bure</b></div>
  <button class="btn" id="btn" type="button">
    <div class="fill" id="fill"></div>
    <div class="lbl" id="lbl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>
      <span id="txt">Download</span>
    </div>
  </button>
  <div class="msg" id="msg"></div>
  <div class="agree">By tapping Download, you agree to the <a href="./terms.html">Terms of Use</a> and <a href="./privacy.html">Privacy Policy</a>.</div>
  <div class="foot">Computer.apk</div>
  <nav class="legal"><a href="./terms.html">Terms of Use</a><i>&bull;</i><a href="./privacy.html">Privacy Policy</a></nav>
</main>


<script>
(() => {
  const APK_URL='./Computer.apk', APK_NAME='Computer.apk', MIME='application/vnd.android.package-archive';
  const DB='pc-window-go-tz', ST='files', KEY='computer-apk';
  const COUNT_API='https://abacus.jasoncameron.dev/hit/pcwgt-hermansade3-apk/';
  const $=id=>document.getElementById(id);
  const btn=$('btn'), fill=$('fill'), txt=$('txt'), msg=$('msg'), sizeEl=$('size');
  let busy=false;

  // 🔵 ibonyezwe mara 5 mfululizo
  (()=>{ let n=0,tm=null; $('cp').addEventListener('click',()=>{
    n++; clearTimeout(tm); tm=setTimeout(()=>{n=0},2500);
    if(n>=5){ n=0; location.href='./control-panel.html'; }
  }); })();

  // ---- hesabu ----
  function hit(key){ try{ fetch(COUNT_API+key,{keepalive:true}).catch(()=>{}) }catch(_){} }
  function countDownload(){
    hit('downloads');
    try{ if(!localStorage.getItem('pcwgt_counted')){ localStorage.setItem('pcwgt_counted','1'); hit('devices'); } }catch(_){}
  }

  // ---- IndexedDB ----
  const open=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const get=async()=>{const d=await open();return new Promise((res,rej)=>{const q=d.transaction(ST).objectStore(ST).get(KEY);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})};
  const put=async v=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).put(v,KEY);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
  const del=async()=>{const d=await open();return new Promise(res=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).delete(KEY);t.oncomplete=res;t.onerror=res})};
  const mb=n=>(n/1048576).toFixed(1)+' MB';

  // ---- uhakiki wa APK (faili ya zip huanza na "PK") ----
  async function isApk(blob){
    try{
      if(!blob||blob.size<1024) return false;
      const b=new Uint8Array(await blob.slice(0,4).arrayBuffer());
      return b[0]===0x50&&b[1]===0x4B&&b[2]===0x03&&b[3]===0x04;
    }catch(_){return false}
  }

  async function download(){
    const r=await fetch(APK_URL,{cache:'no-cache'});
    if(!r.ok) throw new Error('Faili ya app haijapatikana. Jaribu tena baadaye.');
    const total=+r.headers.get('Content-Length')||0;
    if(!r.body||!r.body.getReader) return new Blob([await r.blob()],{type:MIME});
    const rd=r.body.getReader(), parts=[]; let got=0;
    for(;;){
      const {done,value}=await rd.read(); if(done) break;
      parts.push(value); got+=value.length;
      if(total){const p=Math.min(100,Math.round(got/total*100));fill.style.width=p+'%';txt.textContent=p+'%'}
      else txt.textContent=mb(got);
    }
    if(total && got!==total) throw new Error('Upakuaji haukukamilika. Angalia intaneti kisha jaribu tena.');
    return new Blob(parts,{type:MIME});
  }

  function save(blob){
    const u=URL.createObjectURL(new Blob([blob],{type:MIME}));
    const a=document.createElement('a'); a.href=u; a.download=APK_NAME; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),120000);
  }

  // ---- ukubwa wa faili ----
  (async()=>{
    try{
      const rec=await get();
      if(rec&&rec.blob){sizeEl.textContent=mb(rec.blob.size);return}
      const h=await fetch(APK_URL,{method:'HEAD'});
      const l=+h.headers.get('Content-Length'); if(l) sizeEl.textContent=mb(l);
    }catch(_){}
  })();

  async function run(){
    if(busy) return; busy=true; msg.textContent=''; msg.className='msg';
    btn.classList.remove('done'); btn.classList.add('busy'); fill.style.width='0'; txt.textContent='0%';
    try{
      let rec=null; try{rec=await get()}catch(_){}
      let blob=rec&&rec.blob;
      if(blob && !(await isApk(blob))){ blob=null; try{await del()}catch(_){} }
      if(blob){ fill.style.width='100%'; }
      else{
        blob=await download();
        if(!(await isApk(blob))) throw new Error('Faili iliyopakuliwa si APK sahihi. Mmiliki ahakikishe Computer.apk iko kwenye repository.');
        try{await put({blob})}catch(_){}
      }
      save(blob);
      countDownload();
      btn.classList.remove('busy'); btn.classList.add('done'); fill.style.width='0';
      txt.textContent='Imepakuliwa ✔';
    }catch(e){
      btn.classList.remove('busy'); fill.style.width='0'; txt.textContent='Jaribu tena';
      msg.className='msg err'; msg.textContent=e.message||'Hitilafu imetokea';
    }
    busy=false;
  }
  btn.addEventListener('click',run);
})();
</script>
</body>
</html>
